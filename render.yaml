services:
  - type: web
    name: grand-marche
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: ./data
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PUBLIC_URL
        sync: false
