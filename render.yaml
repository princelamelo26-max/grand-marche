# Fichier de configuration pour Render (https://render.com)
# Version GRATUITE : pas de disque persistant, pas de carte bancaire requise.
# Les données (comptes, boutiques, commandes) seront effacées si le service redémarre
# tant que la base de données n'est pas déplacée vers un service externe persistant (ex. Turso).
services:
  - type: web
    name: grand-marche
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: ./data
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PUBLIC_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: mock
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
